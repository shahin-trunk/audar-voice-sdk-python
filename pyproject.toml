[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audar"
version = "0.1.0"
description = "Python SDK for Audar voice services (TTS, STT, Speech Enhancement)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.10",
    "websockets>=13.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
]

[tool.hatch.build.targets.wheel]
packages = ["src/audar"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
